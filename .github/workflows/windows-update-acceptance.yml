name: Windows update acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-update-acceptance:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Diagnose Windows npm layout
        shell: pwsh
        run: |
          node -e "const fs=require('fs'),p=require('path'); const e={...process.env}; const keys=Object.keys(e).filter(k=>/^path$|^pathext$/i.test(k)); const dirs=(e[keys.find(k=>/^path$/i.test(k))]||'').split(';'); console.log('environment keys:',keys.join(','),'node:',process.execPath); for(const d of dirs){for(const n of ['npm.cmd','npm.exe','npm.bat']){const f=p.join(d,n); if(fs.existsSync(f)) console.log('candidate:',f,'real:',fs.realpathSync(f));}} const r=p.join(p.dirname(process.execPath),'node_modules','npm'); console.log('node sibling npm package:',r,'metadata:',fs.existsSync(p.join(r,'package.json')),'cli:',fs.existsSync(p.join(r,'bin','npm-cli.js')));"
      - name: Test Windows npm Path regression
        shell: pwsh
        run: node --import ./tests/helpers/test-env.mjs --test --test-name-pattern="Windows npm resolution accepts" tests/unit/update.test.mjs
      - name: Test Windows backup mode regressions
        shell: pwsh
        run: node --import ./tests/helpers/test-env.mjs --test --test-name-pattern="backup mode comparison|backup validation rejects read-only mode drift" tests/unit/install-backup.test.mjs
      - name: Run native Windows W1-W4 integration acceptance
        shell: pwsh
        run: |
          $env:AKE_RUN_WINDOWS_UPDATE_ACCEPTANCE = '1'
          node --import ./tests/helpers/test-env.mjs --test --test-name-pattern="Windows native W1-W4 pinned-commit Skills CLI update acceptance" tests/integration/update-flow.test.mjs
